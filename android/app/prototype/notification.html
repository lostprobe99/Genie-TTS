<script data-purpose="action-feedback">
    document.querySelectorAll('[data-purpose*="stop-service"]').forEach(button => {
      button.addEventListener('click', () => {
        if (confirm('确认停止朗读接口？停止后客户端将无法调用。')) {
          alert('朗读接口已停止，通知已移除。');
        }
      });
    });

    document.querySelectorAll('[data-purpose="copy-ip-button"]').forEach(button => {
      button.addEventListener('click', () => {
        navigator.clipboard?.writeText('http://192.168.1.8:8001/tts');
        alert('已复制地址: http://192.168.1.8:8001/tts');

<!DOCTYPE html>

<html lang="zh-CN"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>GenieTTS - 编辑角色信息</title>
<!-- Tailwind CSS CDN with forms and container queries -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Tailwind Configuration for GenieTTS Brand Colors -->
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0fdfa',
              100: '#ccfbf1',
              500: '#14b8a6',
              600: '#0d9488',
              700: '#0f766e',
              800: '#115e59',
              900: '#0d4a52',
              dark: '#083339',
            }
          },
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', '"PingFang SC"', '"Hiragino Sans GB"', '"Microsoft YaHei"', '"WenQuanYi Micro Hei"', 'sans-serif']
          }
        }
      }
    }
  </script>
<!-- Custom Scoped Styles -->
<style data-purpose="custom-scrollbars">
    /* Hide scrollbars for clean mobile appearance */
    ::-webkit-scrollbar {
      display: none;
    }
    * {
      -ms-overflow-style: none;
      scrollbar-width: none;
      -webkit-tap-highlight-color: transparent;
    }
  </style>
<style data-purpose="modal-animation">
    /* Smooth modal entrance feel */
    .dialog-card {
      box-shadow: 0 20px 40px -15px rgba(13, 74, 82, 0.35), 0 0 0 1px rgba(13, 74, 82, 0.08);
    }
  </style>
</head>
<body class="bg-slate-900 flex justify-center items-center min-h-screen p-0 m-0 font-sans antialiased select-none text-slate-800">
<!-- Mobile Viewport Container (Android Device Shell: 390px x 844px standard frame) -->
<div class="relative w-full max-w-[412px] h-[892px] bg-[#f4f7f6] overflow-hidden flex flex-col shadow-2xl rounded-[38px] border-[6px] border-slate-800">
<!-- BEGIN: SystemStatusBar -->
<header class="w-full bg-[#0d4a52] text-white pt-2.5 px-6 pb-1.5 flex justify-between items-center text-xs font-medium z-10 shrink-0">
<span class="tracking-normal font-semibold">15:38</span>
<div class="flex items-center space-x-2 text-white/90">
<!-- 5G / Signal Icon -->
<svg class="w-3.5 h-3.5 fill-current" viewbox="0 0 24 24">
<path d="M12 3c-4.97 0-9 4.03-9 9 0 2.12.74 4.07 1.97 5.61L4.2 19.4c-.39.39-.39 1.02 0 1.41.39.39 1.02.39 1.41 0l1.83-1.83C9.07 19.8 10.49 20.3 12 20.3c4.97 0 9-4.03 9-9 0-4.97-4.03-9-9-9zm0 2c3.87 0 7 3.13 7 7 0 1.42-.42 2.74-1.15 3.85L6.15 4.15C7.26 3.42 8.58 3 12 3z"></path>
</svg>
<!-- Wifi Icon -->
<svg class="w-3.5 h-3.5 fill-current" viewbox="0 0 24 24">
<path d="M12 4C7.31 4 3.07 5.9 0 8.98L12 21 24 8.98A16.88 16.88 0 0012 4zm0 3.2c3.48 0 6.64 1.35 9 3.55L12 19.6 3 10.75A13.68 13.68 0 0112 7.2z"></path>
</svg>
<!-- Battery Icon 88% -->
<div class="flex items-center gap-1">
<span class="text-[10px] font-mono">88%</span>
<svg class="w-4 h-3.5 fill-current" viewbox="0 0 24 24">
<path d="M17 5v14H7V5h10m1-2H6c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm2 7v4h1c.55 0 1-.45 1-1v-2c0-.55-.45-1-1-1h-1z"></path>
</svg>
</div>
</div>
</header>
<!-- END: SystemStatusBar -->
<!-- BEGIN: BackgroundAppView -->
<!-- Mimics SCREEN_15 underneath the dialog backdrop -->
<div class="flex-1 flex flex-col w-full h-full overflow-hidden bg-[#eef4f4]">
<!-- App Header Bar -->
<nav class="bg-[#0d4a52] text-white px-4 py-3 flex items-center justify-between shadow-sm">
<div class="flex items-center space-x-3">
<button class="p-1 hover:bg-white/10 rounded-full text-white/90">
<svg class="w-6 h-6 stroke-2 stroke-current fill-none" viewbox="0 0 24 24">
<path d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
<div class="flex items-center space-x-2">
<h1 class="text-xl font-medium tracking-tight">角色管理</h1>
<span class="bg-[#135963] text-teal-200 text-xs px-2.5 py-0.5 rounded-full font-normal">16个角色</span>
</div>
</div>
<div class="flex items-center space-x-3 text-white/90">
<button class="p-1.5 hover:bg-white/10 rounded-full">
<svg class="w-5 h-5 fill-none stroke-2 stroke-current" viewbox="0 0 24 24">
<path d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
<button class="p-1.5 hover:bg-white/10 rounded-full">
<svg class="w-5 h-5 fill-current" viewbox="0 0 24 24">
<circle cx="12" cy="5" r="1.75"></circle>
<circle cx="12" cy="12" r="1.75"></circle>
<circle cx="12" cy="19" r="1.75"></circle>
</svg>
</button>
</div>
</nav>
<!-- Mocked List Body behind backdrop -->
<main class="flex-1 p-3.5 space-y-3 overflow-y-auto filter blur-[0.5px]">
<!-- March 7th Card (Targeted item) -->
<div class="bg-white rounded-2xl p-3.5 shadow-sm border border-teal-200/60 flex items-center justify-between">
<div class="flex items-center space-x-3.5">
<div class="w-12 h-12 rounded-xl bg-teal-600 flex items-center justify-center text-white shadow-inner relative">
<span class="absolute -top-1 -right-1 w-3 h-3 bg-emerald-400 rounded-full ring-2 ring-white"></span>
<svg class="w-6 h-6 fill-current" viewbox="0 0 24 24">
<path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"></path>
</svg>
</div>
<div>
<div class="flex items-center space-x-2">
<span class="font-bold text-slate-800 text-sm">三月七 (March 7th)</span>
<span class="text-teal-600 text-[11px] bg-teal-50 px-1.5 py-0.2 rounded font-medium">默认角色</span>
</div>
<p class="text-xs text-slate-400 font-mono mt-0.5">ID: march_7th_v2</p>
</div>
</div>
<div class="w-9 h-9 rounded-full bg-teal-50 flex items-center justify-center text-teal-700">
<svg class="w-4 h-4 fill-current" viewbox="0 0 24 24">
<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"></path>
</svg>
</div>
</div>
<!-- Nahida Card -->
<div class="bg-white rounded-2xl p-3.5 shadow-sm flex items-center justify-between opacity-80">
<div class="flex items-center space-x-3.5">
<div class="w-12 h-12 rounded-xl bg-emerald-500 text-white flex items-center justify-center">
<svg class="w-6 h-6 fill-current" viewbox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-4H7v-2h4V7h2v4h4v2h-4v4z"></path></svg>
</div>
<div>
<span class="font-bold text-slate-800 text-sm">纳西妲 (草神)</span>
<p class="text-xs text-slate-400 font-mono mt-0.5">ID: nahida_genshin_01</p>
</div>
</div>
<div class="w-9 h-9 rounded-full bg-slate-100 flex items-center justify-center text-slate-600">
<svg class="w-4 h-4 fill-current ml-0.5" viewbox="0 0 24 24"><path d="M8 5v14l11-7z"></path></svg>
</div>
</div>
<!-- Zhongli Card -->
<div class="bg-white rounded-2xl p-3.5 shadow-sm flex items-center justify-between opacity-80">
<div class="flex items-center space-x-3.5">
<div class="w-12 h-12 rounded-xl bg-amber-700 text-white flex items-center justify-center">
<svg class="w-6 h-6 fill-current" viewbox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"></path></svg>
</div>
<div>
<span class="font-bold text-slate-800 text-sm">钟离 (岩王帝君)</span>
<p class="text-xs text-slate-400 font-mono mt-0.5">ID: zhongli_geo_voice</p>
</div>
</div>
<div class="w-9 h-9 rounded-full bg-slate-100 flex items-center justify-center text-slate-600">
<svg class="w-4 h-4 fill-current ml-0.5" viewbox="0 0 24 24"><path d="M8 5v14l11-7z"></path></svg>
</div>
</div>
</main>
</div>
<!-- END: BackgroundAppView -->
<!-- BEGIN: ModalOverlay & EditDialog -->
<!-- Dark semi-transparent backdrop blur overlay -->
<div class="absolute inset-0 bg-black/60 backdrop-blur-[6px] flex items-center justify-center px-4 py-6 z-50 transition-all" data-purpose="dialog-overlay">
<!-- The Dialog Card Container -->
<article class="dialog-card w-full max-w-[364px] bg-white rounded-[26px] p-5 flex flex-col relative text-slate-800 animate-in fade-in duration-200" data-purpose="edit-character-modal">
<!-- BEGIN: DialogHeader -->
<header class="flex items-start justify-between pb-3.5 border-b border-slate-100">
<div class="flex items-center space-x-2.5">
<div class="w-9 h-9 rounded-xl bg-teal-50 border border-teal-100 flex items-center justify-center text-brand-700 shadow-sm">
<!-- Edit Icon -->
<svg class="w-5 h-5 fill-none stroke-[2.2] stroke-current" viewbox="0 0 24 24">
<path d="M16.862 4.487l1.687-1.688a1.875 1.875 0 112.652 2.652L6.832 19.82a4.5 4.5 0 01-1.897 1.13l-2.685.8.8-2.685a4.5 4.5 0 011.13-1.897L16.863 4.487zm0 0L19.5 7.125" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
<div>
<h2 class="text-base font-bold text-slate-900 leading-tight">编辑角色信息</h2>
<p class="text-[11px] text-slate-400 mt-0.5">修改角色显示配置与参考音频参数</p>
</div>
</div>
<!-- Close Modal Icon Button -->
<button aria-label="关闭" class="p-1 rounded-full text-slate-400 hover:text-slate-600 hover:bg-slate-100 transition-colors" type="button">
<svg class="w-5 h-5 fill-none stroke-2 stroke-current" viewbox="0 0 24 24">
<path d="M6 18L18 6M6 6l12 12" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
</header>
<!-- END: DialogHeader -->
<!-- BEGIN: DialogContentForm -->
<form class="space-y-4 pt-3.5" onsubmit="event.preventDefault()">
<!-- Current Character Status Mini Banner -->
<section class="bg-gradient-to-r from-teal-50/90 to-cyan-50/70 border border-teal-100/80 rounded-xl p-2.5 flex items-center justify-between" data-purpose="character-status-summary">
<div class="flex items-center space-x-2.5">
<div class="w-8 h-8 rounded-lg bg-brand-700 text-white flex items-center justify-center shadow-sm">
<!-- Soundwave Icon -->
<svg class="w-4 h-4 fill-current" viewbox="0 0 24 24">
<path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"></path>
</svg>
</div>
<div>
<span class="text-xs font-semibold text-brand-900 block leading-tight">三月七 (March 7th)</span>
<span class="text-[10px] text-teal-700 font-mono">ID: march_7th_v2</span>
</div>
</div>
<span class="inline-flex items-center px-2 py-0.5 rounded-full text-[10px] font-medium bg-brand-700 text-white shadow-xs">
<span class="w-1.5 h-1.5 rounded-full bg-emerald-300 mr-1 animate-pulse"></span>
              默认角色
            </span>
</section>
<!-- Field 1: Character ID (Read-only) -->
<div class="space-y-1" data-purpose="field-character-id">
<label class="block text-xs font-semibold text-slate-700">角色 ID</label>
<div class="relative flex items-center">
<input class="w-full bg-slate-100/90 border border-slate-200 text-slate-600 text-xs font-mono rounded-xl px-3 py-2 pr-16 focus:outline-none cursor-not-allowed select-all" readonly="" type="text" value="march_7th_v2"/>
<button class="absolute right-1.5 px-2 py-1 text-[11px] font-medium text-brand-700 bg-white hover:bg-teal-50 border border-teal-200 rounded-lg shadow-2xs flex items-center gap-1 active:scale-95 transition-transform" title="复制角色ID" type="button">
<svg class="w-3 h-3 stroke-[2] stroke-current fill-none" viewbox="0 0 24 24">
<path d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<span>复制</span>
</button>
</div>
<p class="text-[10px] text-slate-400 flex items-center gap-1 pl-0.5 pt-0.5">
<svg class="w-3 h-3 text-slate-400 shrink-0 fill-current" viewbox="0 0 24 24">
<path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"></path>
</svg>
              角色 ID 由模型文件指定，不可更改
            </p>
</div>
<!-- Field 2: Character Name (Editable) -->
<div class="space-y-1" data-purpose="field-character-name">
<div class="flex items-center justify-between">
<label class="block text-xs font-semibold text-slate-700" for="char-name-input">
                角色名称 <span class="text-rose-500">*</span>
</label>
<span class="text-[10px] text-slate-400 font-mono">12 / 20</span>
</div>
<div class="relative flex items-center">
<input class="w-full bg-white border border-brand-500 ring-2 ring-teal-100 text-slate-800 text-xs font-medium rounded-xl px-3 py-2 pr-7 focus:outline-none focus:border-brand-600 transition" id="char-name-input" maxlength="20" type="text" value="三月七 (March 7th)"/>
<button aria-label="清空输入" class="absolute right-2 text-slate-300 hover:text-slate-500 p-0.5 rounded-full" type="button">
<svg class="w-3.5 h-3.5 fill-current" viewbox="0 0 20 20">
<path clip-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" fill-rule="evenodd"></path>
</svg>
</button>
</div>
</div>
<!-- Field 3: Reference Audio (参考音频) -->
<div class="space-y-1.5" data-purpose="field-reference-audio">
<div class="flex items-center justify-between">
<label class="block text-xs font-semibold text-slate-700">参考音频 (Prompt Audio)</label>
<span class="text-[10px] text-brand-700 bg-brand-50 px-1.5 py-0.5 rounded font-medium">高质量 24kHz</span>
</div>
<!-- Audio playback card -->
<div class="border border-slate-200 bg-slate-50/70 rounded-xl p-2.5 flex items-center justify-between gap-2">
<div class="flex items-center space-x-2.5 overflow-hidden">
<!-- Play Audio Button -->
<button aria-label="试听音频" class="w-8 h-8 rounded-full bg-brand-700 hover:bg-brand-800 text-white flex items-center justify-center shrink-0 shadow-xs active:scale-95 transition" type="button">
<svg class="w-3.5 h-3.5 fill-current ml-0.5" viewbox="0 0 24 24">
<path d="M8 5v14l11-7z"></path>
</svg>
</button>
<div class="truncate">
<div class="flex items-center gap-1.5">
<span class="text-xs font-medium text-slate-800 truncate">sample.wav</span>
<span class="text-[10px] text-slate-400 bg-white px-1 border border-slate-200 rounded font-mono shrink-0">3.2s</span>
</div>
<!-- Mini Waveform visual representation -->
<div class="flex items-center gap-0.5 mt-1 h-2.5 opacity-60">
<span class="w-0.5 h-2 bg-brand-700 rounded-full"></span>
<span class="w-0.5 h-3 bg-brand-700 rounded-full"></span>
<span class="w-0.5 h-1 bg-brand-700 rounded-full"></span>
<span class="w-0.5 h-2.5 bg-brand-700 rounded-full"></span>
<span class="w-0.5 h-1.5 bg-brand-700 rounded-full"></span>
<span class="w-0.5 h-3 bg-brand-700 rounded-full"></span>
<span class="w-0.5 h-2 bg-brand-700 rounded-full"></span>
<span class="w-0.5 h-1 bg-brand-700 rounded-full"></span>
<span class="w-0.5 h-2 bg-slate-300 rounded-full"></span>
<span class="w-0.5 h-1 bg-slate-300 rounded-full"></span>
<span class="w-0.5 h-1.5 bg-slate-300 rounded-full"></span>
</div>
</div>
</div>
<!-- Replace Audio Action -->
<button class="shrink-0 px-2.5 py-1.5 text-[11px] font-medium text-slate-700 hover:text-brand-800 bg-white hover:bg-slate-50 border border-slate-200 rounded-lg flex items-center gap-1 shadow-2xs active:bg-slate-100 transition" type="button">
<svg class="w-3 h-3 stroke-[2] stroke-current fill-none" viewbox="0 0 24 24">
<path d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5m-13.5-9L12 3m0 0l4.5 4.5M12 3v13.5" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<span>替换</span>
</button>
</div>
</div>
<!-- Field 4: Switch Toggle (Default Voice) -->
<div class="pt-0.5 flex items-center justify-between" data-purpose="toggle-default-voice">
<div class="pr-2">
<span class="text-xs font-semibold text-slate-800 block">设为默认发音人</span>
<span class="text-[10px] text-slate-400">TTS 生成时自动预选此角色模型</span>
</div>
<!-- Toggle Switch in Active ON State -->
<button aria-checked="true" class="w-11 h-6 bg-brand-700 rounded-full p-0.5 relative inline-flex items-center transition-colors shrink-0 focus:outline-none shadow-inner" role="switch" type="button">
<span class="w-5 h-5 bg-white rounded-full shadow-md transform translate-x-5 transition-transform"></span>
</button>
</div>
</form>
<!-- END: DialogContentForm -->
<!-- BEGIN: DialogActionButtons -->
<footer class="mt-5 pt-3.5 border-t border-slate-100 flex items-center justify-between" data-purpose="dialog-footer-actions">
<!-- Left: Destructive Action (Delete) -->
<button class="text-red-500 hover:text-red-600 hover:bg-red-50/80 active:bg-red-100 px-2 py-2 rounded-xl text-xs font-medium flex items-center gap-1 transition" type="button">
<svg class="w-3.5 h-3.5 stroke-[2] stroke-current fill-none" viewbox="0 0 24 24">
<path d="M14.74 9l-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 01-2.244 2.077H8.084a2.25 2.25 0 01-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 00-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 013.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 00-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 00-7.5 0" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<span>删除角色</span>
</button>
<!-- Right: Secondary & Primary Action Buttons -->
<div class="flex items-center space-x-2">
<button class="px-3 py-2 text-xs font-medium text-slate-600 hover:text-slate-800 hover:bg-slate-100 rounded-xl border border-slate-200 transition" type="button">
              取消
            </button>
<button class="px-4 py-2 text-xs font-semibold text-white bg-brand-900 hover:bg-brand-dark active:bg-black rounded-xl shadow-sm transition flex items-center space-x-1" type="button">
<svg class="w-3.5 h-3.5 stroke-2 stroke-current fill-none mr-0.5" viewbox="0 0 24 24">
<path d="M4.5 12.75l6 6 9-13.5" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<span>保存修改</span>
</button>
</div>
</footer>
<!-- END: DialogActionButtons -->
</article>
<!-- END: Dialog Card Container -->
</div>
<!-- END: ModalOverlay & EditDialog -->
<!-- BEGIN: SystemGestureBar -->
<div class="w-full bg-[#eef4f4] py-2 flex justify-center items-center shrink-0 z-10">
<div class="w-32 h-1 bg-slate-400 rounded-full"></div>
</div>
<!-- END: SystemGestureBar -->
</div>
</body></html>
